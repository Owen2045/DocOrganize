<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融法規問答助理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0e12;
    --surface: #15161c;
    --glass-bg: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.12);
    --text: #e5e7eb;
    --text-dim: #9ca3af;
    --accent: #5b8cff;
    --accent-contrast: #ffffff;
    --danger: #f87171;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  header {
    background: var(--glass-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--glass-border);
    color: var(--text);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  header h1 { font-size: 1.1rem; font-weight: 600; }

  #session-badge {
    font-size: 0.7rem;
    opacity: 0.6;
    font-family: monospace;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.6;
    overflow-wrap: anywhere;
  }

  .msg.assistant ol, .msg.assistant ul { padding-left: 1.4em; }
  .msg.assistant p { margin: 0.4em 0; }
  .msg.assistant p:first-child { margin-top: 0; }
  .msg.assistant p:last-child { margin-bottom: 0; }

  /* 聊天氣泡維持實色不透明：法規長文字可讀性優先，不套模糊 */
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: var(--accent-contrast);
    border-bottom-right-radius: 4px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid #23252c;
    border-bottom-left-radius: 4px;
  }

  .msg mark {
    background: #fbbf24;
    color: #1c1400;
    padding: 0 2px;
    border-radius: 3px;
  }

  .cursor::after {
    content: "▌";
    animation: blink 0.8s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  #chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 20px;
  }

  #chips:not(:empty) { padding-top: 12px; }

  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    padding: 5px 8px 5px 12px;
    font-size: 0.82rem;
    color: var(--text);
  }

  .chip-remove {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 50%;
  }

  .chip-remove:hover { color: var(--danger); background: rgba(248,113,113,0.15); }

  #input-area {
    background: var(--glass-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--glass-border);
    padding: 14px 20px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    flex-shrink: 0;
  }

  #category-input {
    width: 140px;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 10px;
    font-size: 0.85rem;
    outline: none;
  }
  #category-input:focus { border-color: var(--accent); }

  #attach-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 1rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  #attach-btn:hover { background: rgba(255,255,255,0.1); }

  #input {
    flex: 1;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.95rem;
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 120px;
  }

  #input::placeholder { color: var(--text-dim); }
  #input:focus { border-color: var(--accent); }

  #send {
    background: var(--accent);
    color: var(--accent-contrast);
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    align-self: flex-end;
  }

  #send:disabled { background: #4b5563; cursor: not-allowed; }

  #upload-toggle, #docs-toggle {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--glass-border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #upload-toggle:hover, #docs-toggle:hover { background: rgba(255,255,255,0.15); }

  #upload-status {
    font-size: 0.78rem;
    color: var(--text-dim);
    padding: 0 20px;
  }
  #upload-status.err { color: var(--danger); }

  /* 玻璃感全頁拖放覆蓋層 */
  #drop-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(13,14,18,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #drop-overlay.show { display: flex; }
  #drop-overlay div {
    border: 2px dashed var(--accent);
    border-radius: 16px;
    padding: 40px 60px;
    font-size: 1.1rem;
    color: var(--text);
    background: var(--glass-bg);
  }

  #docs-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #docs-panel-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 24px;
    min-width: 320px;
    max-width: 480px;
    width: 90%;
    max-height: 70vh;
    overflow-y: auto;
  }
  #docs-panel-card h2 { font-size: 1rem; margin-bottom: 14px; color: var(--accent); }
  #docs-list { font-size: 0.9rem; color: var(--text); }
  #docs-close {
    margin-top: 16px;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--glass-border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>金融法規問答助理</h1>
  <div style="display:flex;gap:12px;align-items:center">
    <span id="session-badge"></span>
    <button id="upload-toggle">上傳文件</button>
    <button id="docs-toggle">已索引文件</button>
  </div>
</header>

<div id="docs-panel">
  <div id="docs-panel-card">
    <h2>已索引文件</h2>
    <div id="docs-list"></div>
    <button id="docs-close">關閉</button>
  </div>
</div>

<div id="drop-overlay"><div>放開以上傳文件</div></div>

<div id="chat">
  <div class="msg assistant">您好！我是金融法規問答助理，可以回答證券投資信託相關法規問題。也可以拖曳文件到畫面上傳，再告訴我要歸檔還是比較。</div>
</div>

<div id="chips"></div>
<div id="upload-status"></div>

<div id="input-area">
  <input id="file-input-hidden" type="file" accept=".pdf,.md,.txt" multiple style="display:none">
  <button id="attach-btn" title="附加檔案">📎</button>
  <input id="category-input" list="category-list" placeholder="分類（選填）">
  <datalist id="category-list"></datalist>
  <textarea id="input" rows="1" placeholder="輸入問題，按 Enter 送出..."></textarea>
  <button id="send">送出</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const sessionId = Math.random().toString(36).slice(2, 10);
  document.getElementById("session-badge").textContent = "Session: " + sessionId;

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const chipsEl = document.getElementById("chips");
  const uploadStatus = document.getElementById("upload-status");
  const categoryInput = document.getElementById("category-input");
  const categoryList = document.getElementById("category-list");

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function highlightArticles(text) {
    return text.replace(/第\s*\d+\s*條(?:之\d+)?/g, m => `<mark>${m}</mark>`);
  }

  function normalizeMd(text) {
    return text
      .replace(/([^\n])(#{1,3} )/g, '$1\n\n$2')   // ponytail: heading mid-line → newline
      .replace(/([^\n])(\s*)(\d+\.\s)/g, '$1\n$3'); // numbered list mid-line
  }

  function addMsg(role, text = "") {
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (role === "assistant") div.innerHTML = highlightArticles(marked.parse(normalizeMd(text)));
    else div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    addMsg("user", text);
    const bubble = addMsg("assistant");
    bubble.classList.add("cursor");

    let full = "";

    try {
      const resp = await fetch("/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true }).replace(/\r/g, "");

        const lines = buf.split("\n");
        buf = lines.pop();

        let event = null;
        for (const line of lines) {
          if (line.startsWith("event: ")) event = line.slice(7).trim();
          else if (line.startsWith("data: ")) {
            const data = line.slice(6);
            if (event === "token") {
              full += data;
              bubble.innerHTML = highlightArticles(marked.parse(normalizeMd(full)));
              chat.scrollTop = chat.scrollHeight;
            } else if (event === "error") {
              bubble.textContent = "錯誤：" + data;
            }
          }
        }
      }
    } catch (e) {
      bubble.textContent = "發生錯誤，請稍後再試。";
    }

    bubble.classList.remove("cursor");
    sendBtn.disabled = false;
    input.focus();
    // 這輪對話可能透過 ingest_documents/compare_documents 動到 pending 清單，重新同步
    refreshPending();
  }

  // ---- 暫存文件（chip）----

  function renderChips(pending) {
    chipsEl.innerHTML = pending.map(p => `
      <span class="chip" data-filename="${escapeHtml(p.filename)}">
        <span>${escapeHtml(p.filename)}${p.category ? ` · ${escapeHtml(p.category)}` : ""}</span>
        <button class="chip-remove" title="移除">✕</button>
      </span>`).join("");
  }

  async function refreshPending() {
    const r = await fetch(`/pending?session_id=${sessionId}`);
    const j = await r.json();
    renderChips(j.pending);
  }

  chipsEl.addEventListener("click", async (e) => {
    const btn = e.target.closest(".chip-remove");
    if (!btn) return;
    const filename = btn.closest(".chip").dataset.filename;
    await fetch(`/pending?session_id=${sessionId}&filename=${encodeURIComponent(filename)}`, { method: "DELETE" });
    refreshPending();
  });

  // ---- 上傳（點擊 / 拖放共用）----

  async function uploadFiles(fileList) {
    if (!fileList || !fileList.length) return;
    const fd = new FormData();
    for (const f of fileList) fd.append("files", f);
    fd.append("session_id", sessionId);
    fd.append("category", categoryInput.value.trim());

    uploadStatus.className = "";
    uploadStatus.textContent = "上傳中...";
    try {
      const r = await fetch("/upload", { method: "POST", body: fd });
      const j = await r.json();
      renderChips(j.pending);
      if (j.rejected.length) {
        uploadStatus.className = "err";
        uploadStatus.textContent = "拒絕：" + j.rejected.join("、");
      } else {
        uploadStatus.textContent = j.staged.length ? `已加入暫存：${j.staged.join("、")}` : "";
      }
    } catch {
      uploadStatus.className = "err";
      uploadStatus.textContent = "上傳失敗";
    }
  }

  const fileInputHidden = document.getElementById("file-input-hidden");
  function openFilePicker() { fileInputHidden.click(); }
  document.getElementById("attach-btn").addEventListener("click", openFilePicker);
  document.getElementById("upload-toggle").addEventListener("click", openFilePicker);
  fileInputHidden.addEventListener("change", () => {
    uploadFiles(fileInputHidden.files);
    fileInputHidden.value = "";
  });

  // 全頁拖放：用 counter 處理巢狀元素觸發的 dragenter/dragleave
  const dropOverlay = document.getElementById("drop-overlay");
  let dragCounter = 0;
  document.body.addEventListener("dragenter", e => {
    e.preventDefault();
    dragCounter++;
    dropOverlay.classList.add("show");
  });
  document.body.addEventListener("dragleave", e => {
    e.preventDefault();
    dragCounter = Math.max(0, dragCounter - 1);
    if (dragCounter === 0) dropOverlay.classList.remove("show");
  });
  document.body.addEventListener("dragover", e => e.preventDefault());
  document.body.addEventListener("drop", e => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove("show");
    uploadFiles(e.dataTransfer.files);
  });

  // 分類 datalist：頁面載入時直接抓一次（不再綁在上傳面板 toggle 上）
  (async () => {
    const r = await fetch("/categories");
    const j = await r.json();
    categoryList.innerHTML = j.categories.map(c => `<option value="${escapeHtml(c)}">`).join("");
  })();

  // 已索引文件面板
  const docsPanel = document.getElementById("docs-panel");
  const docsList = document.getElementById("docs-list");
  document.getElementById("docs-toggle").addEventListener("click", async () => {
    docsList.textContent = "載入中…";
    docsPanel.style.display = "flex";
    const r = await fetch("/indexed-docs");
    const j = await r.json();
    if (!j.docs.length) { docsList.textContent = "尚無已索引文件。"; return; }
    docsList.innerHTML = j.docs.map(d =>
      `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.08);gap:8px">
         <span style="flex:1">${escapeHtml(d.source)}</span>
         <span style="color:var(--accent);font-size:0.8rem">${escapeHtml(d.category)}</span>
         <span style="color:var(--text-dim);white-space:nowrap">${d.chunks} chunks</span>
       </div>`
    ).join("");
  });
  document.getElementById("docs-close").addEventListener("click", () => docsPanel.style.display = "none");
  docsPanel.addEventListener("click", e => { if (e.target === docsPanel) docsPanel.style.display = "none"; });

  sendBtn.addEventListener("click", send);

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });
</script>

</body>
</html>
