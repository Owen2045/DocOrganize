<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融法規問答助理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #1a56db;
    color: white;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  header h1 { font-size: 1.1rem; font-weight: 600; }

  #session-badge {
    font-size: 0.7rem;
    opacity: 0.7;
    font-family: monospace;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user {
    align-self: flex-end;
    background: #1a56db;
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: white;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 4px;
  }

  .msg mark {
    background: #fef08a;
    color: #713f12;
    padding: 0 2px;
    border-radius: 3px;
  }

  .cursor::after {
    content: "▌";
    animation: blink 0.8s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  #input-area {
    background: white;
    border-top: 1px solid #e5e7eb;
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  #input {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.95rem;
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 120px;
  }

  #input:focus { border-color: #1a56db; }

  #send {
    background: #1a56db;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    align-self: flex-end;
  }

  #send:disabled { background: #9ca3af; cursor: not-allowed; }

  #upload-toggle {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #upload-toggle:hover { background: rgba(255,255,255,0.25); }

  #upload-panel {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 14px 20px;
    display: none;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  #upload-panel.open { display: flex; }

  #file-input { flex: 1; font-size: 0.9rem; }

  #upload-btn {
    background: #1a56db;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #upload-btn:disabled { background: #9ca3af; cursor: not-allowed; }

  #upload-status { font-size: 0.85rem; color: #6b7280; white-space: nowrap; }
  #upload-status.ok  { color: #16a34a; }
  #upload-status.err { color: #dc2626; }
</style>
</head>
<body>

<header>
  <h1>金融法規問答助理</h1>
  <div style="display:flex;gap:12px;align-items:center">
    <span id="session-badge"></span>
    <button id="upload-toggle">上傳文件</button>
  </div>
</header>

<div id="upload-panel">
  <input id="file-input" type="file" accept=".md,.txt" multiple>
  <button id="upload-btn">上傳</button>
  <span id="upload-status"></span>
</div>

<div id="chat">
  <div class="msg assistant">您好！我是金融法規問答助理，可以回答證券投資信託相關法規問題。請問有什麼需要協助的？</div>
</div>

<div id="input-area">
  <textarea id="input" rows="1" placeholder="輸入問題，按 Enter 送出..."></textarea>
  <button id="send">送出</button>
</div>

<script>
  const sessionId = crypto.randomUUID();
  document.getElementById("session-badge").textContent = "Session: " + sessionId.slice(0, 8);

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  function highlightArticles(text) {
    return text.replace(/第\s*\d+\s*條(?:之\d+)?/g, m => `<mark>${m}</mark>`);
  }

  function addMsg(role, text = "") {
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (role === "assistant") div.innerHTML = highlightArticles(text);
    else div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    addMsg("user", text);
    const bubble = addMsg("assistant");
    bubble.classList.add("cursor");

    let full = "";

    try {
      const resp = await fetch("/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        const lines = buf.split("\n");
        buf = lines.pop();

        let event = null;
        for (const line of lines) {
          if (line.startsWith("event: ")) event = line.slice(7).trim();
          else if (line.startsWith("data: ")) {
            const data = line.slice(6);
            if (event === "token") {
              full += data;
              bubble.innerHTML = highlightArticles(full);
              chat.scrollTop = chat.scrollHeight;
            }
          }
        }
      }
    } catch (e) {
      bubble.textContent = "發生錯誤，請稍後再試。";
    }

    bubble.classList.remove("cursor");
    sendBtn.disabled = false;
    input.focus();
  }

  // upload
  const uploadToggle = document.getElementById("upload-toggle");
  const uploadPanel  = document.getElementById("upload-panel");
  const fileInput    = document.getElementById("file-input");
  const uploadBtn    = document.getElementById("upload-btn");
  const uploadStatus = document.getElementById("upload-status");

  uploadToggle.addEventListener("click", () => uploadPanel.classList.toggle("open"));

  uploadBtn.addEventListener("click", async () => {
    if (!fileInput.files.length) return;
    uploadBtn.disabled = true;
    uploadStatus.className = "";
    uploadStatus.textContent = "上傳中...";

    const fd = new FormData();
    for (const f of fileInput.files) fd.append("files", f);

    try {
      const r = await fetch("/upload", { method: "POST", body: fd });
      const j = await r.json();
      uploadStatus.className = "ok";
      uploadStatus.textContent = `已上傳：${j.uploaded.join(", ")}`;
      fileInput.value = "";
    } catch {
      uploadStatus.className = "err";
      uploadStatus.textContent = "上傳失敗";
    }
    uploadBtn.disabled = false;
  });

  sendBtn.addEventListener("click", send);

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });
</script>

</body>
</html>
