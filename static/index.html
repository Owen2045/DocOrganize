<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融法規問答助理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #1a56db;
    color: white;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  header h1 { font-size: 1.1rem; font-weight: 600; }

  #session-badge {
    font-size: 0.7rem;
    opacity: 0.7;
    font-family: monospace;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.6;
    overflow-wrap: anywhere;
  }

  .msg.assistant ol, .msg.assistant ul { padding-left: 1.4em; }
  .msg.assistant p { margin: 0.4em 0; }
  .msg.assistant p:first-child { margin-top: 0; }
  .msg.assistant p:last-child { margin-bottom: 0; }

  .msg.user {
    align-self: flex-end;
    background: #1a56db;
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: white;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 4px;
  }

  .msg mark {
    background: #fef08a;
    color: #713f12;
    padding: 0 2px;
    border-radius: 3px;
  }

  .cursor::after {
    content: "▌";
    animation: blink 0.8s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  #input-area {
    background: white;
    border-top: 1px solid #e5e7eb;
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  #input {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.95rem;
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 120px;
  }

  #input:focus { border-color: #1a56db; }

  #send {
    background: #1a56db;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    align-self: flex-end;
  }

  #send:disabled { background: #9ca3af; cursor: not-allowed; }

  #upload-toggle, #docs-toggle {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #upload-toggle:hover, #docs-toggle:hover { background: rgba(255,255,255,0.25); }

  #upload-panel {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 14px 20px;
    display: none;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  #upload-panel.open { display: flex; }

  #file-input { flex: 1; font-size: 0.9rem; }

  #upload-btn {
    background: #1a56db;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #upload-btn:disabled { background: #9ca3af; cursor: not-allowed; }

  #upload-status { font-size: 0.85rem; color: #6b7280; white-space: nowrap; }
  #upload-status.ok  { color: #16a34a; }
  #upload-status.err { color: #dc2626; }
</style>
</head>
<body>

<header>
  <h1>金融法規問答助理</h1>
  <div style="display:flex;gap:12px;align-items:center">
    <span id="session-badge"></span>
    <button id="upload-toggle">上傳文件</button>
    <button id="docs-toggle">已索引文件</button>
  </div>
</header>

<div id="docs-panel" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center">
  <div style="background:white;border-radius:10px;padding:24px;min-width:320px;max-width:480px;width:90%;max-height:70vh;overflow-y:auto;position:relative">
    <h2 style="font-size:1rem;margin-bottom:14px;color:#1a56db">已索引文件</h2>
    <div id="docs-list" style="font-size:0.9rem;color:#374151"></div>
    <button id="docs-close" style="margin-top:16px;background:#e5e7eb;border:none;border-radius:6px;padding:6px 14px;cursor:pointer">關閉</button>
  </div>
</div>

<div id="upload-panel">
  <input id="file-input" type="file" accept=".pdf,.md,.txt" multiple>
  <div style="display:flex;align-items:center;gap:6px;white-space:nowrap">
    <label style="font-size:0.85rem">分類：</label>
    <input id="category-input" list="category-list" placeholder="選擇或輸入分類" style="width:160px;border:1px solid #d1d5db;border-radius:6px;padding:5px 8px;font-size:0.85rem">
    <datalist id="category-list"></datalist>
  </div>
  <label style="font-size:0.85rem;display:flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer">
    <input type="checkbox" id="overwrite-check"> 覆蓋並重建
  </label>
  <button id="upload-btn">上傳</button>
  <span id="upload-status"></span>
</div>

<div id="chat">
  <div class="msg assistant">您好！我是金融法規問答助理，可以回答證券投資信託相關法規問題。請問有什麼需要協助的？</div>
</div>

<div id="input-area">
  <textarea id="input" rows="1" placeholder="輸入問題，按 Enter 送出..."></textarea>
  <button id="send">送出</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const sessionId = Math.random().toString(36).slice(2, 10);
  document.getElementById("session-badge").textContent = "Session: " + sessionId;

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  function highlightArticles(text) {
    return text.replace(/第\s*\d+\s*條(?:之\d+)?/g, m => `<mark>${m}</mark>`);
  }

  function normalizeMd(text) {
    return text
      .replace(/([^\n])(#{1,3} )/g, '$1\n\n$2')   // ponytail: heading mid-line → newline
      .replace(/([^\n])(\s*)(\d+\.\s)/g, '$1\n$3'); // numbered list mid-line
  }

  function addMsg(role, text = "") {
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (role === "assistant") div.innerHTML = highlightArticles(marked.parse(normalizeMd(text)));
    else div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    addMsg("user", text);
    const bubble = addMsg("assistant");
    bubble.classList.add("cursor");

    let full = "";

    try {
      const resp = await fetch("/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true }).replace(/\r/g, "");

        const lines = buf.split("\n");
        buf = lines.pop();

        let event = null;
        for (const line of lines) {
          if (line.startsWith("event: ")) event = line.slice(7).trim();
          else if (line.startsWith("data: ")) {
            const data = line.slice(6);
            if (event === "token") {
              full += data;
              bubble.innerHTML = highlightArticles(marked.parse(normalizeMd(full)));
              chat.scrollTop = chat.scrollHeight;
            } else if (event === "error") {
              bubble.textContent = "錯誤：" + data;
            }
          }
        }
      }
    } catch (e) {
      bubble.textContent = "發生錯誤，請稍後再試。";
    }

    bubble.classList.remove("cursor");
    sendBtn.disabled = false;
    input.focus();
  }

  // upload
  const uploadToggle = document.getElementById("upload-toggle");
  const uploadPanel  = document.getElementById("upload-panel");
  const fileInput    = document.getElementById("file-input");
  const uploadBtn    = document.getElementById("upload-btn");
  const uploadStatus = document.getElementById("upload-status");

  const categoryInput = document.getElementById("category-input");
  const categoryList  = document.getElementById("category-list");

  uploadToggle.addEventListener("click", async () => {
    uploadPanel.classList.toggle("open");
    if (uploadPanel.classList.contains("open")) {
      const r = await fetch("/categories");
      const j = await r.json();
      categoryList.innerHTML = j.categories.map(c => `<option value="${c}">`).join("");
    }
  });

  uploadBtn.addEventListener("click", async () => {
    if (!fileInput.files.length) return;
    uploadBtn.disabled = true;
    uploadStatus.className = "";
    uploadStatus.textContent = "上傳中...";

    const fd = new FormData();
    for (const f of fileInput.files) fd.append("files", f);
    fd.append("overwrite", document.getElementById("overwrite-check").checked ? "true" : "false");
    fd.append("category", categoryInput.value.trim());

    try {
      const r = await fetch("/upload", { method: "POST", body: fd });
      const j = await r.json();
      const parts = [];
      if (j.uploaded.length)    parts.push(`已上傳：${j.uploaded.join(", ")}`);
      if (j.reindexing.length)  parts.push(`重建索引中：${j.reindexing.join(", ")}`);
      if (j.skipped.length)     parts.push(`已存在（略過）：${j.skipped.join(", ")}`);
      if (j.rejected.length)    parts.push(`拒絕：${j.rejected.join(", ")}`);
      const pending = [...j.uploaded, ...j.reindexing].map(f => f.replace(/\.[^.]+$/, ""));
      uploadStatus.className = (j.uploaded.length || j.reindexing.length) ? "ok" : "err";
      uploadStatus.textContent = parts.join("　");
      fileInput.value = "";

      if (pending.length) {
        uploadStatus.textContent += "　（索引建立中…）";
        const done = new Set();
        const timer = setInterval(async () => {
          for (const src of pending) {
            if (done.has(src)) continue;
            const res = await fetch(`/ingest-status?source=${encodeURIComponent(src)}`);
            const s = await res.json();
            if (s.done) done.add(src);
          }
          if (done.size === pending.length) {
            clearInterval(timer);
            uploadStatus.textContent = uploadStatus.textContent.replace("（索引建立中…）", "✅ 索引完成");
          }
        }, 10000);
      }
    } catch {
      uploadStatus.className = "err";
      uploadStatus.textContent = "上傳失敗";
    }
    uploadBtn.disabled = false;
  });

  // indexed docs panel
  const docsPanel  = document.getElementById("docs-panel");
  const docsList   = document.getElementById("docs-list");
  document.getElementById("docs-toggle").addEventListener("click", async () => {
    docsList.textContent = "載入中…";
    docsPanel.style.display = "flex";
    const r = await fetch("/indexed-docs");
    const j = await r.json();
    if (!j.docs.length) { docsList.textContent = "尚無已索引文件。"; return; }
    docsList.innerHTML = j.docs.map(d =>
      `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f3f4f6;gap:8px">
         <span style="flex:1">${d.source}</span>
         <span style="color:#1a56db;font-size:0.8rem">${d.category}</span>
         <span style="color:#6b7280;white-space:nowrap">${d.chunks} chunks</span>
       </div>`
    ).join("");
  });
  document.getElementById("docs-close").addEventListener("click", () => docsPanel.style.display = "none");
  docsPanel.addEventListener("click", e => { if (e.target === docsPanel) docsPanel.style.display = "none"; });

  sendBtn.addEventListener("click", send);

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });
</script>

</body>
</html>
